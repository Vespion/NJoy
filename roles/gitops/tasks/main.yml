- name: Ensure git and ansible are installed for ansible-pull
  ansible.builtin.package:
    name:
      - git
      - ansible-core
      - dnf-automatic
    state: present

- name: Enable dnf-automatic
  ansible.builtin.systemd_service:
    name: dnf-automatic-install.timer
    state: started
    enabled: true

- name: Deploy gitops service unit file
  ansible.builtin.template:
    src: gitops.service.j2
    dest: "/etc/systemd/system/gitops.service"
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd daemon

- name: Deploy gitops timer unit file
  ansible.builtin.template:
    src: gitops.timer.j2
    dest: "/etc/systemd/system/gitops.timer"
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd daemon

- name: Flush handlers to ensure daemon is reloaded
  ansible.builtin.meta: flush_handlers

- name: Enable and start gitops timer
  ansible.builtin.systemd:
    name: "gitops.timer"
    state: started
    enabled: true
    daemon_reload: true
