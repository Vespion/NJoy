---
- name: Install Podman and SELinux utilities
  ansible.builtin.package:
    name:
      - podman
      - shadow-utils
      - policycoreutils-python-utils
    state: present

- name: Ensure service user exists with nologin shell
  ansible.builtin.user:
    name: kanidm_svc
    shell: /usr/sbin/nologin
    system: true
    create_home: true
    home: /srv/kandim
    state: present
  register: kanidm_service_user

- name: Configure subuid and subgid for rootless namespaces
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: "{{ kanidm_service_user.name }}:100000:65536"
    regexp: "^{{ kanidm_service_user.name }}:"
    create: true
    mode: "0644"
  loop:
    - /etc/subuid
    - /etc/subgid

- name: Enable systemd linger for non-login service user
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ kanidm_service_user.name }}"
    creates: "/var/lib/systemd/linger/{{ kanidm_service_user.name }}"
