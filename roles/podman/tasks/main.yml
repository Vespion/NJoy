- name: Ensure Podman and Alpine rootless dependencies are installed
  ansible.builtin.package:
    name:
      - podman
      - ufw
    state: present
- name: Ensure subordinate UID range exists for automatic namespaces
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: "containers:1000000:655360"
    create: true
    mode: '0644'
  loop:
    - /etc/subuid
    - /etc/subgid
