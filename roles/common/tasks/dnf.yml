---
- name: Upgrade dnf packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_only: true

- name: Install dnf plugins
  ansible.builtin.package:
    name:
      - dnf-automatic
      - dnf5-plugins
    state: present

- name: Configure dnf-automatic
  ansible.builtin.systemd_service:
    name: dnf-automatic-install.timer
    state: started

- name: Add additional system packages
  ansible.builtin.package:
    name: "{{ common_additional_dnf_packages }}"
    state: present

- name: Clean up unneeded packages
  ansible.builtin.dnf:
    autoremove: true
    state: absent
