- name: Deploy UFW Application Profile for container service
  ansible.builtin.template:
    src: ufw-app.j2
    dest: "/etc/ufw/applications.d/podman-{{ container.name }}"
    mode: '0644'
  when: container.ports is defined and container.ports | length > 0
  notify: Reload ufw

- name: Ensure named Podman volumes exist
  containers.podman.podman_volume:
    state: present
    name: "{{ vol_name }}"
  vars:
    vol_name: "{{ item.split(':')[0] }}"
  # Skips bind mounts (paths starting with / or .)
  when: not vol_name.startswith('/') and not vol_name.startswith('.')
  loop: "{{ container.volumes | default([]) }}"
  loop_control:
    label: "{{ vol_name }}"

- name: Deploy System-level Podman Quadlet
  ansible.builtin.template:
    src: container.container.j2
    dest: "/etc/containers/systemd/{{ container.name }}.container"
    mode: '0644'
  notify: Reload systemd daemon

- name: Allow gamemasters to toggle system game servers
  ansible.builtin.template:
    src: container.sudoers.j2
    dest: "/etc/sudoers.d/{{ container.name }}"
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
