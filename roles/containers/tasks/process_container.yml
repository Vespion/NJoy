---
- name: Create dedicated system user for {{ container.name }}
  ansible.builtin.user:
    name: "svc-{{ container.name }}"
    group: containers
    system: true
    create_home: true
    shell: /bin/bash
  register: _container_user

- name: Enable systemd linger for svc-{{ container.name }}
  ansible.builtin.command: "loginctl enable-linger svc-{{ container.name }}"
  args:
    creates: "/var/lib/systemd/linger/svc-{{ container.name }}"

- name: Deploy UFW Application Profile for {{ container.name }}
  ansible.builtin.template:
    src: ufw-app.j2
    dest: "/etc/ufw/applications.d/podman-{{ container.name }}"
    mode: '0644'
  when: container.ports is defined and container.ports | length > 0
  notify: Reload ufw

- name: Ensure Quadlet directory exists for svc-{{ container.name }}
  become: true
  become_user: "svc-{{ container.name }}"
  ansible.builtin.file:
    path: "/home/svc-{{ container.name }}/.config/containers/systemd"
    state: directory
    mode: '0755'

- name: Ensure named Podman volumes exist for svc-{{ container.name }}
  become: true
  become_user: "svc-{{ container.name }}"
  environment:
    # Dynamically inject the correct UID for this specific container's user
    XDG_RUNTIME_DIR: "/run/user/{{ _container_user.uid }}"
  containers.podman.podman_volume:
    state: present
    name: "{{ vol_name }}"
  vars:
    vol_name: "{{ item.split(':')[0] }}"
  when: not vol_name.startswith('/') and not vol_name.startswith('.')
  loop: "{{ container.volumes | default([]) }}"
  loop_control:
    label: "{{ vol_name }}"

- name: Deploy Podman Quadlet for {{ container.name }}
  become: true
  become_user: "svc-{{ container.name }}"
  ansible.builtin.template:
    src: container.container.j2
    dest: "/home/svc-{{ container.name }}/.config/containers/systemd/{{ container.name }}.container"
    mode: '0644'
  register: _quadlet

- name: Reload systemd daemon for svc-{{ container.name }}
  become: true
  become_user: "svc-{{ container.name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _container_user.uid }}"
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  when: _quadlet.changed # noqa: no-handler
