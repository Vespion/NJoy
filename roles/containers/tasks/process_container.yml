- name: Create dedicated user for container service
  ansible.builtin.user:
    name: "svc-{{ container.name }}"
    system: false
    create_home: true
    shell: /sbin/nologin
  register: _container_user

- name: Enable systemd linger for container service
  ansible.builtin.command: "loginctl enable-linger svc-{{ container.name }}"
  args:
    creates: "/var/lib/systemd/linger/svc-{{ container.name }}"

- name: Deploy UFW Application Profile for container service
  ansible.builtin.template:
    src: ufw-app.j2
    dest: "/etc/ufw/applications.d/podman-{{ container.name }}"
    mode: '0644'
  when: container.ports is defined and container.ports | length > 0
  notify: Reload ufw

- name: Deploy systemd management wrapper script for container service
  ansible.builtin.template:
    src: manage-service.sh.j2
    dest: "/usr/local/bin/manage-{{ container.name }}"
    mode: '0755'
    owner: root
    group: root

- name: Allow gamemasters to run the management script as container service user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/gamemasters-{{ container.name }}"
    content: >
      %gamemasters ALL=(svc-{{ container.name }}) NOPASSWD:
       /usr/local/bin/manage-{{ container.name }} start,
       /usr/local/bin/manage-{{ container.name }} stop,
       /usr/local/bin/manage-{{ container.name }} restart,
       /usr/local/bin/manage-{{ container.name }} status
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Ensure Quadlet directory exists for container service
  become: true
  become_user: "svc-{{ container.name }}"
  ansible.builtin.file:
    path: "/home/svc-{{ container.name }}/.config/containers/systemd"
    state: directory
    mode: '0755'

- name: Ensure named Podman volumes exist for container service
  become: true
  become_user: "svc-{{ container.name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _container_user.uid }}"
  containers.podman.podman_volume:
    state: present
    name: "{{ vol_name }}"
  vars:
    vol_name: "{{ item.split(':')[0] }}"
  when: not vol_name.startswith('/') and not vol_name.startswith('.')
  loop: "{{ container.volumes | default([]) }}"
  loop_control:
    label: "{{ vol_name }}"

- name: Deploy Podman Quadlet for container service
  become: true
  become_user: "svc-{{ container.name }}"
  ansible.builtin.template:
    src: container.container.j2
    dest: "/home/svc-{{ container.name }}/.config/containers/systemd/{{ container.name }}.container"
    mode: '0644'
  register: _quadlet

- name: Reload systemd daemon for container service
  become: true
  become_user: "svc-{{ container.name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _container_user.uid }}"
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  when: _quadlet.changed # noqa: no-handler
