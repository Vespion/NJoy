- name: NJoy GitOps Configuration
  hosts: localhost
  connection: local
  become: true
  vars:
    users:
      - name: alice
        groups:
          - wheel
      - name: link
        
    podman_containers:
      - name: cobblemon
        stop_timeout: 300
        image: ghcr.io/vespion/njoy/cobblemon:1.2.0
        volumes:
          - cobblemon-world:/srv/minecraft/world
        ports:
          - "25565:25565/tcp"
          - "24454:24454/udp"
  roles:
    - admin
    - gitops
    - podman
    - containers