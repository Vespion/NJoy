---
- name: Bootstrap
  hosts: all
  remote_user: root
  become: true

  vars:
    packages:
      - ufw
      - fail2ban
      - python3

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Reload ufw
      ansible.builtin.command: ufw reload
      changed_when: true

  tasks:
    - name: Install required packages
      ansible.builtin.package:
        name: "{{ packages }}"
        state: present

    - name: Create admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        group: wheel
        create_home: true

    - name: Add SSH public key for admin user
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: https://github.com/vespion.keys

    - name: Add admin to sudo
      ansible.builtin.copy:
        mode: "0440"
        group: root
        owner: root
        content: "{{ admin_user }}\tALL = (ALL) NOPASSWD:ALL" # noqa: ansible-lint no-tabs
        dest: /etc/sudoers.d/admin

    - name: Add ansible group
      ansible.builtin.group:
        name: ansible
        state: present

    - name: Create ansible user
      register: ansible_user_result
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        group: ansible
        groups: cdrom,floppy
        shell: /bin/bash
        create_home: true
        state: present

    - name: Add SSH public key for ansible user
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        exclusive: true
        key: "{{ lookup('file', ansible_user_key) }}"
      vars:
        ansible_user_key: "vault/{{ ansible_facts.hostname }}/{{ ansible_facts.hostname }}.key.pub"

    - name: Add ansible to sudo
      ansible.builtin.copy:
        mode: "0440"
        group: root
        owner: root
        content: "{{ ansible_user }}\tALL = (ALL) NOPASSWD:ALL" # noqa: ansible-lint no-tabs
        dest: /etc/sudoers.d/ansible

    - name: Set default ssh rules
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/60-default.conf
        group: root
        owner: root
        mode: "0600"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
      notify: Restart sshd

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        name: SSH

    - name: Enable UFW with default deny
      community.general.ufw:
        state: enabled
        default: deny
      notify: Reload ufw

    - name: Enable fail2ban service
      ansible.builtin.service:
        name: fail2ban
        enabled: true

    - name: Enable gitops
      ansible.builtin.import_role:
        name: gitops
